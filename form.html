<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form | WDD 131 | Sibusiso Manyoni</title>

    <meta
        name="description"
        content="WDD 131 product review form by Sibusiso Manyoni for submitting product ratings, features, and written reviews."
    >

    <meta name="author" content="Sibusiso Manyoni">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <div class="form-group">
                <label for="productName">Product Name</label>
                <select id="productName" name="product" required>
                    <option value="" disabled selected>
                        Select a Product ...
                    </option>
                </select>
            </div>

            <!-- Overall Rating -->
            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating">
                    <label for="rating1">
                        <span>☆</span>
                        <input
                            type="radio"
                            id="rating1"
                            name="rating"
                            value="1"
                            required
                        >
                        <span class="rating-number">1</span>
                    </label>

                    <label for="rating2">
                        <span>☆☆</span>
                        <input
                            type="radio"
                            id="rating2"
                            name="rating"
                            value="2"
                            required
                        >
                        <span class="rating-number">2</span>
                    </label>

                    <label for="rating3">
                        <span>☆☆☆</span>
                        <input
                            type="radio"
                            id="rating3"
                            name="rating"
                            value="3"
                            required
                        >
                        <span class="rating-number">3</span>
                    </label>

                    <label for="rating4">
                        <span>☆☆☆☆</span>
                        <input
                            type="radio"
                            id="rating4"
                            name="rating"
                            value="4"
                            required
                        >
                        <span class="rating-number">4</span>
                    </label>

                    <label for="rating5">
                        <span>☆☆☆☆☆</span>
                        <input
                            type="radio"
                            id="rating5"
                            name="rating"
                            value="5"
                            required
                        >
                        <span class="rating-number">5</span>
                    </label>
                </div>
            </fieldset>

            <!-- Installation Date -->
            <div class="form-group">
                <label for="installDate">Date of Installation</label>
                <input
                    type="date"
                    id="installDate"
                    name="installDate"
                    required
                >
            </div>

            <!-- Useful Features -->
            <fieldset>
                <legend>
                    Which features did you find useful?
                    <span class="optional">(Check all that apply)</span>
                </legend>

                <div class="checkbox-group">
                    <label for="durability">
                        <input
                            type="checkbox"
                            id="durability"
                            name="features"
                            value="durability"
                        >
                        Durability
                    </label>

                    <label for="easeOfUse">
                        <input
                            type="checkbox"
                            id="easeOfUse"
                            name="features"
                            value="ease-of-use"
                        >
                        Ease of Use
                    </label>

                    <label for="performance">
                        <input
                            type="checkbox"
                            id="performance"
                            name="features"
                            value="performance"
                        >
                        Performance
                    </label>

                    <label for="design">
                        <input
                            type="checkbox"
                            id="design"
                            name="features"
                            value="design"
                        >
                        Design
                    </label>
                </div>
            </fieldset>

            <!-- Written Review -->
            <div class="form-group">
                <label for="writtenReview">
                    Written Review
                    <span class="optional">(Optional)</span>
                </label>

                <textarea
                    id="writtenReview"
                    name="review"
                    rows="6"
                ></textarea>
            </div>

            <!-- User Name -->
            <div class="form-group">
                <label for="userName">
                    Your Name
                    <span class="optional">(Optional)</span>
                </label>

                <input
                    type="text"
                    id="userName"
                    name="userName"
                >
            </div>

            <!-- Submit -->
            <input
                type="submit"
                value="Post Review"
                class="submit-button"
            >

        </form>
    </main>

    <footer>
        <p>
            &copy;
            <span id="currentyear"></span>
            Sibusiso Manyoni | South Africa
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
